<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Defne Kaptan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle">

    <aside class="sidebar">
        <label for="sidebar-toggle" class="sidebar-click-area" title="Toggle Menu"></label>
        <div class="logo-trigger">
            <span class="logo">DK</span>
        </div>
        
        <ul class="nav-links">
            <li>
                <a href="index.html">Home</a>
                <img src="cat-active.png" alt="Active Cat" class="nav-cat">
            </li>
            <li>
                <a href="projects.html" class="active">Projects</a>
                <img src="cat-active.png" alt="Active Cat" class="nav-cat">
            </li>
            <li>
                <a href="connect.html">Connect</a>
                <img src="cat-active.png" alt="Active Cat" class="nav-cat">
            </li>
        </ul>
    </aside>

    <img src="cat-peeking.png" alt="Peeking Cat" class="sidebar-cat">

    <main class="landing-container">
        <div class="topics-stack">
        
    
            <div class="topic-accordion-group">
                <input type="checkbox" id="arch-expand" class="accordion-toggle">

                <div class="frame-container arch-frame-box">
                    <div class="back-frame"></div>

                    <label for="arch-expand" class="topic-trigger-card main-big-photo">
                        <div class="image-wrapper wide-ratio">
                            <span class="image-label">Architecture</span>
                            <img src="project-arch.jpg" alt="Architecture Project">
                        </div>
                    </label>

                    <div class="split-workspace">
                        <div class="split-photo pos-1">
                            <img src="sub-1.jpg" alt="Project 1">
                            <span>architecture school</span>
                        </div>
                        <div class="split-photo pos-2">
                            <img src="sub-2.jpg" alt="Project 2">
                            <span>modeling</span>
                        </div>
                        <div class="split-photo pos-3">
                            <img src="sub-3.jpg" alt="Project 3">
                            <span></span>
                        </div>
                        <div class="split-photo pos-4">
                            <img src="sub-4.jpg" alt="Project 4">
                            <span>anomly</span>
                        </div>
                        <div class="split-photo pos-5">
                            <img src="sub-5.jpg" alt="Project 5">
                            <span>topography</span>
                        </div>
                    </div>
                </div>

                <label for="arch-expand" class="topic-info">
                    <h2>Architecture <span class="expand-indicator">+</span></h2>
                </label>

                <div class="card-cat">
                    <img src="cat-stretching.png" alt="Stretching Cat">
                </div>
            </div>

            <div class="topic-accordion-group">
                <input type="checkbox" id="ideas-expand" class="accordion-toggle">

                <label for="ideas-expand" class="topic-trigger-card">
                    <div class="frame-container ideas-frame-box">
                        <div class="back-frame"></div>
                        <div class="image-wrapper wide-ratio">
                            <span class="image-label">Art & Ideas</span>
                            <img src="project-ideas.png" alt="Art and Ideas Project">
                        </div>
                    </div>
                    <div class="topic-info">
                        <h2>Art & Ideas <span class="expand-indicator">+</span></h2>
                    </div>
                </label>

                <div class="sub-projects-drawer">
                    <ul class="sub-project-list">
                        <li><a href="#">human</a></li>
                        <li><a href="#">sketches and progress</a></li>
                        <li><a href="#">figurative art</a></li>
                    </ul>
                </div>

                <div class="card-cat">
                    <img src="cat-stretching.png" alt="Stretching Cat">
                </div>
            </div>

            <div class="topic-accordion-group">
                <input type="checkbox" id="gallery-expand" class="accordion-toggle">

                <label for="gallery-expand" class="topic-trigger-card">
                    <div class="frame-container gallery-frame-box">
                        <div class="back-frame"></div>
                        <div class="image-wrapper wide-ratio">
                            <span class="image-label">Gallery</span>
                            <img src="project-gallery.png" alt="Gallery Project">
                        </div>
                    </div>
                    <div class="topic-info">
                        <h2>Gallery <span class="expand-indicator">+</span></h2>
                    </div>
                </label>

                <div class="sub-projects-drawer">
                    <ul class="sub-project-list">
                        <li><a href="#">city and shadow</a></li>
                        <li><a href="#">sun, sea and Turkey</a></li>
                    </ul>
                </div>

                <div class="card-cat">
                    <img src="cat-stretching.png" alt="Stretching Cat">
                </div>
            </div>

        </div>
    </main>

</body>
</html>
